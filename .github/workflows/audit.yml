name: audit

# Runs on a macOS runner because Homebrew casks are macOS only, and because a
# clean runner sidesteps the vendored-gem breakage that makes brew audit
# unrunnable on some local installs.
on:
  push:
  pull_request:
  workflow_dispatch:
  # A push made with the built-in GITHUB_TOKEN does not trigger workflows, so
  # the updater's commits would never be audited without this. workflow_run
  # fires on the other workflow finishing rather than on its push, which is not
  # subject to that restriction.
  workflow_run:
    workflows: ["update casks"]
    types: [completed]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap this checkout
        run: |
          set -euo pipefail
          target="$(brew --repository)/Library/Taps/tevvvb/homebrew-tap"
          mkdir -p "$(dirname "$target")"
          ln -s "$GITHUB_WORKSPACE" "$target"
          brew tap

      - name: Audit
        run: brew audit --cask --strict tevvvb/tap/termagitchi

      - name: Install it for real
        run: |
          set -euo pipefail
          brew install --cask tevvvb/tap/termagitchi
          pets version
          pets --help | head -3
